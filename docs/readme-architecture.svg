<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">House Price Prediction workflow</title><desc id="desc">A Jupyter notebook cleans the flat-price dataset, explores features, trains Linear Regression, and evaluates regression performance.</desc><rect width="1200" height="400" rx="18" fill="#F3F1E9"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#63856A">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#30372E">House Price Prediction</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#74786E">Area and BHK inputs to a predicted price</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#DADBCF"/><path d="M 300 237 L 330 237" stroke="#74786E" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#74786E" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#74786E" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#74786E" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#74786E" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#74786E" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFDF8" stroke="#DADBCF" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#63856A"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#63856A">01 / DATA</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#30372E">House_Price.csv</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#74786E">Load flat price, area, and BHK.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFDF8" stroke="#DADBCF" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#A98A58"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#A98A58">02 / CLEAN</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#30372E">Prepare features</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#74786E">Convert price strings and extract numbers.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFDF8" stroke="#DADBCF" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#7F9695"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#7F9695">03 / MODEL</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#30372E">Linear Regression</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#74786E">Fit the regression model on a train split.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFDF8" stroke="#DADBCF" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#63856A"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#63856A">04 / EVALUATE</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#30372E">RMSE and R²</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#74786E">Review prediction error and fit.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#63856A">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#74786E">A simple regression is an educational baseline, not a market valuation.</text></svg>